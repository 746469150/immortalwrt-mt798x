name: Build BT-R320 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev \
        libssl-dev python3 rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone https://github.com/hanwckf/immortalwrt-mt798x.git source

    - name: Update feeds
      run: |
        cd source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy config
      run: |
        cp .config source/.config
        cd source
        make defconfig

    - name: Build firmware
      run: |
        cd source
        make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: source/bin/targets/
