name: Build BT-R320 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev \
        libssl-dev python3 rsync unzip zlib1g-dev file wget

    - name: Clone source
      run: |
        git clone https://github.com/hanwckf/immortalwrt-mt798x.git source

    - name: Update feeds
      run: |
        cd source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ⭐ 自定义系统名称（重点）
    - name: Custom system name
      run: |
        cd source
        sed -i "s/hostname='OpenWrt'/hostname='BT-R320-Pro'/g" package/base-files/files/bin/config_generate || true
        sed -i "s/OpenWrt/BT-R320-Pro/g" package/base-files/files/etc/banner || true
        echo "DISTRIB_DESCRIPTION='BT-R320-Pro Build $(date +%Y.%m.%d)'" > package/base-files/files/etc/openwrt_release

    - name: Load config
      run: |
        if [ -f .config ]; then
          cp .config source/.config
        else
          cd source
          cp defconfig/mt7981-ax3000.config .config
        fi
        cd source
        make defconfig

    - name: Build firmware
      run: |
        cd source
        make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: source/bin/targets/
